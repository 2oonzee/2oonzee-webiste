<!doctype html>
<html>
    <html lang="ar" dir="rtl">
        <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>كرتون بالعربي</title>
            <link rel="icon" type="image/png" href="/orglogo.png">
            <style>
                * {
                    margin: 0;
                    padding: 0;
                    box-sizing: border-box;
                    font-family: "Cairo", sans-serif;
                }
                body {
                    background: #050505;
                    color: white;
                    overflow: hidden;
                } /* Loading Screen */
                #loader {
                    position: fixed;
                    width: 100%;
                    height: 100%;
                    background: #000;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    flex-direction: column;
                    z-index: 9999;
                }
                .spinner {
                    width: 90px;
                    height: 90px;
                    border: 7px solid #222;
                    border-top: 7px solid cyan;
                    border-radius: 50%;
                    animation: spin 1s linear infinite;
                    margin-bottom: 25px;
                }
                @keyframes spin {
                    100% {
                        transform: rotate(360deg);
                    }
                }
                #loader h2 {
                    font-size: 30px;
                    color: white;
                    letter-spacing: 2px;
                } /* Main */
                #main {
                    display: none;
                    padding: 40px;
                    min-height: 100vh;
                    background: linear-gradient(180deg, #050505, #101010);
                }
                header {
                    text-align: center;
                    margin-bottom: 50px;
                }
                header h1 {
                    font-size: 45px;
                    color: cyan;
                    text-shadow: 0 0 20px cyan;
                }
                header p {
                    color: #aaa;
                    margin-top: 10px;
                    font-size: 18px;
                }
                .cards {
                    display: grid;
                    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                    gap: 35px;
                }
                .card {
                    background: #111;
                    border-radius: 18px;
                    overflow: hidden;
                    cursor: pointer;
                    transition: 0.35s;
                    border: 2px solid #222;
                    box-shadow: 0 0 20px rgba(0, 255, 255, 0.15);
                }
                .card:hover {
                    transform: translateY(-10px) scale(1.03);
                    border-color: cyan;
                    box-shadow: 0 0 35px cyan;
                }
                .card img {
                    width: 100%;
                    height: 360px;
                    object-fit: cover;
                }
                .card h2 {
                    padding: 20px;
                    text-align: center;
                    font-size: 28px;
                }
                footer {
                    text-align: center;
                    margin-top: 60px;
                    color: #666;
                }
            </style>
        </head>
        <body>
            <div id="loader">
                <div class="spinner"></div>
                <h2>Loading...</h2>
            </div>
            <div id="main">
                <header>
                    <h1>🎬 كرتون بالعربي</h1>
                    <p>اختر الكرتون الذي تريد مشاهدته</p>
                </header>
                <div class="cards">
                    <div class="card" onclick="location.href='gumball/'">
                        <img
                            src="https://i.pinimg.com/originals/23/c5/d9/23c5d9dd3daf24f4670d8d6c52e36960.png"
                            alt=""
                        />
                        <h2>عالم غامبول المدهش</h2>
                    </div>
                    <div class="card" onclick="location.href='clarence/'">
                        <img
                            src="https://tse2.mm.bing.net/th/id/OIP.Ul8j8iwLTJAlXk9fHew7fwHaFj?r=0&rs=1&pid=ImgDetMain&o=7&rm=3"
                            alt=""
                        />
                        <h2>كلارنس</h2>
                    </div>
                    <div class="card" onclick="location.href='regularshow/'">
                        <img
                            src="https://tse3.mm.bing.net/th/id/OIP.pz04CJIMipyP49WYjfY5fQHaFj?r=0&rs=1&pid=ImgDetMain&o=7&rm=3"
                            alt=""
                        />
                        <h2>العرض العادي</h2>
                    </div>
                </div>
                <footer><p>©2oonzee - YouTube</p></footer>
            </div>
            <script>
                setTimeout(function () {
                    document.getElementById("loader").style.display = "none";
                    document.getElementById("main").style.display = "block";
                    document.body.style.overflow = "auto";
                }, 2500);
            </script>
        </body>
    </html>
    "
</html>
