<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - الصفحة غير موجودة</title>
<link rel="icon" href="/orglogo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{display:flex;justify-content:center;align-items:center;height:100vh;background:linear-gradient(180deg,#050505,#101010);color:#fff}
.card{text-align:center;max-width:700px;padding:40px}
h1{font-size:120px;color:#00BFFF;text-shadow:0 0 25px #00BFFF}
h2{font-size:36px;margin:10px 0 15px}
p{color:#aaa;font-size:18px;margin-bottom:35px}
.home-btn{display:inline-flex;align-items:center;gap:12px;padding:12px 22px;background:#111;border:2px solid #222;border-radius:16px;color:#fff;text-decoration:none;transition:.3s}
.home-btn:hover{background:#00BFFF;border-color:#00BFFF;box-shadow:0 0 25px rgba(0,191,255,.7);transform:translateY(-3px)}
.material-icons{font-size:24px}
.small{margin-top:28px;color:#666}
</style>
</head>
<body>
<div class="card">
<h1>404</h1>
<h2>الصفحة غير موجودة</h2>
<p>عذرًا، الصفحة التي تبحث عنها غير موجودة أو تم حذفها.</p>
<a href="/" class="home-btn">
<span class="material-icons">home</span>
<span>العودة إلى الرئيسية</span>
</a>
<div class="small">سيتم تحويلك إلى الصفحة الرئيسية خلال 5 ثوانٍ...</div>
</div>
<script>
setTimeout(()=>window.location.href="/",5000);
</script>
</body>
</html>
