<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stardima | عالم غامبول المدهش</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link href="https://vjs.zencdn.net/8.23.4/video-js.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

    <a href="../index.html" class="home-btn">
        <span>🏠</span>
        <span>الرئيسية</span>
    </a>

    <h1 class="logo">
        عالم غامبول المدهش
    </h1>

</header>

<section class="banner">

    <div class="banner-overlay">

        <h2>عالم غامبول المدهش</h2>

        <p>
            شاهد جميع الحلقات بالدبلجة العربية
        </p>

    </div>

</section>

<main class="main-layout">

    <section class="player-section">

        <div class="video-box">

            <video
                id="videoPlayer"
                class="video-js vjs-big-play-centered"
                controls
                preload="auto"
                playsinline
                data-setup="{}">

                <source src="" type="video/mp4">

            </video>

        </div>

        <div class="episode-card">

            <h2 id="episodeTitle">
                اختر حلقة
            </h2>

            <p id="episodeDescription">
                اختر حلقة من القائمة لبدء المشاهدة.
                نتمنى لكم مشاهدة ممتعة ويمكنكم تحميل الحلقة في أي وقت.
            </p>

            <a id="downloadBtn"
               class="download-btn"
               href="#">
                ⬇ تحميل الحلقة
            </a>

        </div>

    </section>

    <aside class="sidebar">

        <div class="card">

            <h3>المواسم</h3>

            <select id="seasonSelect"></select>

        </div>

        <div class="card">

            <h3>الحلقات</h3>

            <div id="episodeList"></div>

        </div>

    </aside>

</main>

<script src="https://vjs.zencdn.net/8.23.4/video.min.js"></script>
<script src="episodes.js"></script>
<script src="player.js"></script>

</body>
</html>
