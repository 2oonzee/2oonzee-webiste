<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عالم غامبول المدهش | 2oonzee</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    background:#050505;
    color:white;
}

header{
    background:#111;
    padding:20px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:2px solid #222;
}

header h1{
    color:#00BFFF;
}

header a{
    color:white;
    text-decoration:none;
    background:#222;
    padding:10px 18px;
    border-radius:10px;
    transition:.3s;
}

header a:hover{
    background:#00BFFF;
    color:white;
}

.container{
    max-width:1200px;
    margin:40px auto;
    padding:0 20px;
}

.player{
    width:100%;
    height:650px;
    background:#111;
    border:2px solid #222;
    border-radius:15px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#777;
    font-size:30px;
}

.info{
    margin-top:25px;
}

.info h2{
    color:#00BFFF;
    margin-bottom:10px;
}
</style>

</head>
<body>

<header>
    <a href="../">🏠 الرئيسية</a>
    <h1>عالم غامبول المدهش</h1>
</header>

<div class="container">

    <div class="player">
        🎬 سيتم وضع مشغل الفيديو هنا
    </div>

    <div class="info">
        <h2>عالم غامبول المدهش</h2>
        <p>قريبًا سيتم إضافة المواسم والحلقات ومشغل الفيديو.</p>
    </div>

</div>

</body>
</html>
