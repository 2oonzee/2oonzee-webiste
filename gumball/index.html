<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07131d">
<title>Stardima | عالم غامبول المدهش</title>
<link rel="icon" href="/channels4_profile.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- Video.js only -->
<link href="https://vjs.zencdn.net/8.23.4/video-js.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="loader">
    <div class="loader-circle"></div>
    <h2>Loading...</h2>
</div>

<div id="main">

<header class="topbar">
   <a href="../" class="home-btn">
    <span class="home-icon">⌂</span>
    <span>العودة للرئيسية</span>
</a>
    <h1 class="logo">عالم غامبول المدهش</h1>
</header>

<section class="banner">
    <div class="banner-overlay">
        <h2>شاهد جميع حلقات عالم غامبول المدهش</h2>
        <p>جميع الحلقات بالدبلجة العربية.</p>
    </div>
</section>

<main class="main-layout">

<section class="player-section">
    <div class="player-card">

        <video
            id="videoPlayer"
            class="video-js vjs-big-play-centered"
            controls
            preload="metadata"
            playsinline
            width="100%"
            height="100%"
            data-setup="{}">

            <source id="videoSource" src="" type="video/mp4">

            <p class="vjs-no-js">
                لتشغيل الفيديو، يرجى تفعيل JavaScript في متصفحك.
            </p>
        </video>

        <div class="player-actions">

            <button type="button" id="prevEpisode">
                <span aria-hidden="true">‹</span>
                <span>الحلقة السابقة</span>
            </button>

            <a id="downloadEpisode"
               class="download-btn"
               href="#"
               target="_blank"
               rel="noopener">
                <span aria-hidden="true">↓</span>
                <span>تحميل الحلقة</span>
            </a>

            <button type="button" id="nextEpisode">
                <span>الحلقة التالية</span>
                <span aria-hidden="true">›</span>
            </button>

        </div>

        <div class="now-playing">
            <h3>يعرض الآن</h3>
            <h2 id="episodeTitle">اختر حلقة</h2>
            <p id="episodeDescription">
                اختر حلقة من القائمة لبدء المشاهدة.
                نتمنى لكم مشاهدة ممتعة.
            </p>
        </div>

    </div>
</section>

<aside class="sidebar">

    <div class="box">
        <h3>المواسم</h3>
        <select id="seasonSelect" aria-label="اختيار الموسم"></select>
    </div>

    <div class="box">
        <h3>الحلقات</h3>
        <div id="episodeList"></div>
    </div>

</aside>

</main>
</div>

<script src="https://vjs.zencdn.net/8.23.4/video.min.js"></script>
<script src="episodes.js"></script>
<script src="player.js"></script>

<script>
window.addEventListener("load", function () {
    window.setTimeout(function () {
        const loader = document.getElementById("loader");
        const main = document.getElementById("main");
        if (loader) loader.style.display = "none";
        if (main) main.style.display = "block";
    }, 500);
});
</script>

</body>
</html>
