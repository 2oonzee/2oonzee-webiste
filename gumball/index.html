<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stardima | عالم غامبول المدهش</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Video.js -->
    <link
        href="https://vjs.zencdn.net/8.23.4/video-js.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="loader">
    <div class="loader-circle"></div>
    <h2>Loading...</h2>
</div>

<div id="main">

    <!-- HEADER -->

    <header class="topbar">

        <a href="../" class="home-btn">
            <span class="home-icon">⌂</span>
            <span>العودة للرئيسية</span>
        </a>

        <h1 class="logo">
            عالم غامبول المدهش
        </h1>

    </header>


    <!-- BANNER -->

    <section class="banner">

        <div class="banner-overlay">

            <h2>
                شاهد جميع حلقات عالم غامبول المدهش
            </h2>

            <p>
                جميع الحلقات بالدبلجة العربية
            </p>

        </div>

    </section>


    <!-- MAIN -->

    <main class="main-layout">


        <!-- PLAYER -->

        <section class="player-section">

            <div class="player-card">

                <video
                    id="videoPlayer"
                    class="video-js vjs-big-play-centered"
                    controls
                    preload="metadata"
                    playsinline>

                    <p class="vjs-no-js">
                        المتصفح الخاص بك لا يدعم تشغيل الفيديو.
                    </p>

                </video>


                <!-- ACTIONS -->

                <div class="player-actions">

                    <button id="prevEpisode" type="button">
                        ⏮ الحلقة السابقة
                    </button>

                    <a
                        id="downloadEpisode"
                        class="download-btn"
                        href="#"
                        target="_blank"
                        rel="noopener">

                        ⬇ تحميل الحلقة

                    </a>

                    <button id="nextEpisode" type="button">
                        الحلقة التالية ⏭
                    </button>

                </div>


                <!-- NOW PLAYING -->

                <div class="now-playing">

                    <h3>
                        يعرض الآن
                    </h3>

                    <h2 id="episodeTitle">
                        اختر حلقة
                    </h2>

                    <p id="episodeDescription">
                        اختر حلقة من القائمة لبدء المشاهدة.
                    </p>

                </div>

            </div>

        </section>


        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="box">

                <h3>
                    المواسم
                </h3>

                <select id="seasonSelect"></select>

            </div>


            <div class="box">

                <h3>
                    الحلقات
                </h3>

                <div id="episodeList"></div>

            </div>

        </aside>

    </main>

</div>


<!-- Video.js -->

<script src="https://vjs.zencdn.net/8.23.4/video.min.js"></script>

<!-- Your files -->

<script src="episodes.js"></script>
<script src="player.js"></script>


<script>

window.addEventListener("load", function () {

    setTimeout(function () {

        document.getElementById("loader").style.display = "none";

        document.getElementById("main").style.display = "block";

    }, 500);

});

</script>

</body>
</html>
