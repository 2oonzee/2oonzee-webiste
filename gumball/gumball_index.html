<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عالم غامبول المدهش</title><link rel="icon" href="/orglogo.png"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Cairo,sans-serif}body{background:#050505;color:#fff}#loader{position:fixed;inset:0;background:#000;display:flex;justify-content:center;align-items:center;flex-direction:column}.spinner{width:90px;height:90px;border:7px solid #222;border-top:7px solid #00BFFF;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}#main{display:none;padding:30px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.home-btn{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none}.home-icon{width:56px;height:56px;background:#222;border:2px solid #444;border-radius:14px;display:flex;justify-content:center;align-items:center}h1{color:#00BFFF}.layout{display:grid;grid-template-columns:3fr 1fr;gap:20px}video{width:100%;aspect-ratio:16/9;background:#000}.sidebar{background:#111;padding:16px;border-radius:12px}select,.episode{width:100%;margin-bottom:10px;padding:10px;background:#222;color:#fff;border:none;border-radius:8px}@media(max-width:900px){.layout{grid-template-columns:1fr}}</style></head><body><div id="loader"><div class="spinner"></div><h2>Loading...</h2></div><div id="main"><header><a href="../" class="home-btn"><div class="home-icon"><span class="material-icons">home</span></div><span>❮ الرئيسية</span></a><h1>عالم غامبول المدهش</h1></header><div class="layout"><div><video controls></video><h2 style="margin-top:15px;color:#00BFFF">اختر حلقة</h2><p>سيتم إضافة المواسم والحلقات قريبًا.</p></div><div class="sidebar"><select><option>الموسم 1</option><option>الموسم 2</option><option>الموسم 3</option><option>الموسم 4</option><option>الموسم 5</option><option>الموسم 6</option></select><button class="episode">الحلقة 1</button><button class="episode">الحلقة 2</button><button class="episode">الحلقة 3</button></div></div></div><script>setTimeout(()=>{loader.style.display="none";main.style.display="block";},2500);</script></body></html>
