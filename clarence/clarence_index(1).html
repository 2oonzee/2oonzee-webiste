<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كلارنس</title>

<link rel="icon" href="/orglogo.png">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Rounded" rel="stylesheet">
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#07131d;
color:#fff;
overflow-x:hidden;
}

a{
text-decoration:none;
color:white;
}

#loader{
position:fixed;
inset:0;
background:#07131d;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
}

.loader-circle{
width:90px;
height:90px;
border-radius:50%;
border:8px solid #17384d;
border-top-color:#58c94b;
animation:spin 1s linear infinite;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

#main{
display:none;
padding:25px;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
gap:20px;
}

.home-btn{
    display:flex;
    align-items:center;
    gap:10px;

    background:linear-gradient(135deg,#58c94b,#0a8cff);

    color:#fff;

    padding:14px 24px;

    border-radius:15px;

    font-size:17px;

    font-weight:700;

    text-decoration:none;

    transition:all .3s ease;

    box-shadow:0 8px 25px rgba(40,199,255,.35);
}

.home-btn:hover{
    transform:translateY(-3px) scale(1.05);

    background:linear-gradient(135deg,#6fe061,#3fb84d);

    box-shadow:0 12px 35px rgba(40,199,255,.55);
}

.home-btn:active{
    transform:scale(.97);
}

header h1{
font-size:32px;
color:#58c94b;
}

.banner{
height:220px;
border-radius:22px;
overflow:hidden;
background:
linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.65)),
url("https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1600&auto=format&fit=crop");
background-size:cover;
background-position:center;
margin-bottom:25px;
display:flex;
align-items:end;
}

.overlay{
padding:35px;
}

.overlay h2{
font-size:34px;
margin-bottom:10px;
}

.overlay p{
font-size:18px;
opacity:.85;
}

.container{
display:grid;
grid-template-columns:2fr 360px;
gap:25px;
}

.player-card{
background:#10202c;
padding:18px;
border-radius:22px;
box-shadow:0 0 30px rgba(0,0,0,.25);
}

video{
width:100%;
aspect-ratio:16/9;
background:black;
border-radius:18px;
}

.player-actions{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:15px;
margin-top:18px;
}

.player-actions button{
height:52px;
border:none;
border-radius:14px;
background:#1b3649;
color:white;
font-size:16px;
cursor:pointer;
display:flex;
justify-content:center;
align-items:center;
gap:8px;
transition:.25s;
}

.player-actions button:hover{
background:#58c94b;
color:#00151d;
}

.now-playing{
margin-top:22px;
background:#132c3f;
padding:18px;
border-radius:16px;
}

.now-playing h3{
color:#58c94b;
margin-bottom:8px;
}

.sidebar{
display:flex;
flex-direction:column;
gap:20px;
}

.box{
background:#10202c;
padding:18px;
border-radius:18px;
}

.box h3{
margin-bottom:15px;
color:#58c94b;
}

select{
width:100%;
height:50px;
background:#17384d;
border:none;
border-radius:12px;
color:white;
padding:0 15px;
font-size:16px;
}

#episodeList{
display:flex;
flex-direction:column;
gap:12px;
max-height:600px;
overflow-y:auto;
padding-right:5px;
}

.episode{
background:#17384d;
padding:14px;
border-radius:12px;
cursor:pointer;
transition:.25s;
font-weight:700;
}

.episode:hover{
background:#58c94b;
color:#00131d;
}

.episode.active{
background:#58c94b;
color:#00131d;
}

::-webkit-scrollbar{
width:8px;
}

::-webkit-scrollbar-thumb{
background:#58c94b;
border-radius:50px;
}

@media(max-width:950px){

header{
flex-direction:column;
align-items:flex-start;
}

.banner{
height:160px;
}

.overlay h2{
font-size:24px;
}

.container{
grid-template-columns:1fr;
}

.player-actions{
grid-template-columns:1fr;
}

header h1{
font-size:26px;
}

#main{
padding:15px;
}

}

</style>

</head>

<body>

<div id="loader">

<div class="loader-circle"></div>

<h2>Loading...</h2>

</div>

<div id="main">

<header>

<a href="../" class="home-btn">

<span class="material-icons-rounded">home</span>

<span>العودة للرئيسية</span>

</a>

</header>


<section class="banner">

<div class="overlay">

<h2>

شاهد جميع حلقات كلارنس

</h2>

<p>

جميع حلقات كلارنس بالدبلجة العربية.

</p>

</div>

</section>


<div class="container">


<div class="player-card">

<video id="player" playsinline controls>

<source id="videoSource">

</video>

<div class="player-actions">

<button id="prevEpisode">

<span class="material-icons-rounded">

skip_previous

</span>

الحلقة السابقة

</button>

<button id="downloadEpisode">

<span class="material-icons-rounded">

download

</span>

تحميل الحلقة

</button>

<button id="nextEpisode">

الحلقة التالية

<span class="material-icons-rounded">

skip_next

</span>

</button>

</div>


<div class="now-playing">

<h3>

يعرض الآن

</h3>

<p id="episodeTitle">

اختر حلقة

</p>

</div>

</div>


<aside class="sidebar">

<div class="box">

<h3>

المواسم

</h3>

<select id="seasonSelect">

</select>

</div>

<div class="box">

<h3>

الحلقات

</h3>

<div id="episodeList">

</div>

</div>

</aside>


</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>

<script>

// ----------------------------
// Gumball Player V2
// ----------------------------

function createEpisodes(season, count) {
    const episodes = [];

    for (let i = 1; i <= count; i++) {
        episodes.push({
            title: `الحلقة ${i}`,
            file: `../videos/clarence/season-${season}/episode-${i}.mp4`
        });
    }

    return episodes;
}

const seasons = {

    1: createEpisodes(1, 26),

    2: createEpisodes(2, 25),

    3: createEpisodes(3, 27)

};

const player = new Plyr("#player");

const video = document.getElementById("player");
const source = document.getElementById("videoSource");

const seasonSelect = document.getElementById("seasonSelect");
const episodeList = document.getElementById("episodeList");

const episodeTitle = document.getElementById("episodeTitle");

const prevBtn = document.getElementById("prevEpisode");
const nextBtn = document.getElementById("nextEpisode");
const downloadBtn = document.getElementById("downloadEpisode");

let currentSeason = 1;
let currentEpisode = 0;

// ----------------------------
// Fill Seasons
// ----------------------------

for (const season in seasons) {

    const option = document.createElement("option");

    option.value = season;

    option.textContent = "الموسم " + season;

    seasonSelect.appendChild(option);

}

// ----------------------------
// Load Episode List
// ----------------------------

function loadEpisodes() {

    episodeList.innerHTML = "";

    const list = seasons[currentSeason];

    list.forEach((ep, index) => {

        const div = document.createElement("div");

        div.className = "episode";

        if(index === currentEpisode){

            div.classList.add("active");

        }

        div.textContent = ep.title;

        div.onclick = () => {

            currentEpisode = index;

            playEpisode();

        };

        episodeList.appendChild(div);

    });

}

// ----------------------------
// Play Episode
// ----------------------------

function playEpisode(){

    const ep = seasons[currentSeason][currentEpisode];

    source.src = ep.file;

    video.load();

    episodeTitle.textContent =
        "الموسم " +
        currentSeason +
        " • " +
        ep.title;

    downloadBtn.onclick = () => {

        window.open(ep.file);

    };

    loadEpisodes();

}

// ----------------------------
// Season Change
// ----------------------------

seasonSelect.onchange = () => {

    currentSeason = Number(seasonSelect.value);

    currentEpisode = 0;

    playEpisode();

};

// ----------------------------
// Previous
// ----------------------------

prevBtn.onclick = () => {

    if(currentEpisode > 0){

        currentEpisode--;

        playEpisode();

    }

};

// ----------------------------
// Next
// ----------------------------

nextBtn.onclick = () => {

    if(currentEpisode < seasons[currentSeason].length - 1){

        currentEpisode++;

        playEpisode();

    }

};

// ----------------------------
// Loader
// ----------------------------

window.addEventListener("load",()=>{

    setTimeout(()=>{

        document.getElementById("loader").style.display="none";

        document.getElementById("main").style.display="block";

    },700);

});

// ----------------------------
// Start
// ----------------------------

playEpisode();

</script>

</body>

</html>
