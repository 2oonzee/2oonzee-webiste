<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كلارنس</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#050505;
color:white;
overflow:hidden;
}

/* Loading Screen */

#loader{
position:fixed;
width:100%;
height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
}

.spinner{
width:90px;
height:90px;
border:7px solid #222;
border-top:7px solid #4CAF50;
border-radius:50%;
animation:spin 1s linear infinite;
margin-bottom:25px;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

/* Main */

#main{
display:none;
padding:40px;
min-height:100vh;
background:linear-gradient(180deg,#050505,#101010);
}

header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:40px;
}

header h1{
font-size:40px;
color:#4CAF50;
text-shadow:0 0 20px #4CAF50;
}

.home{
background:#111;
padding:10px 18px;
border-radius:12px;
text-decoration:none;
color:white;
transition:.3s;
border:2px solid #222;
}

.home:hover{
background:#4CAF50;
}

.player{
width:100%;
height:650px;
background:#111;
border-radius:18px;
border:2px solid #222;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
color:#666;
}

.info{
margin-top:25px;
}

.info h2{
color:#4CAF50;
margin-bottom:10px;
}

.info p{
color:#aaa;
}

</style>

</head>

<body>

<div id="loader">

<div class="spinner"></div>

<h2>Loading...</h2>

</div>

<div id="main">

<header>

<a class="home" href="../">🏠 الرئيسية</a>

<h1>كلارنس</h1>

</header>

<div class="player">

🎬 سيتم وضع مشغل الفيديو هنا

</div>

<div class="info">

<h2>كلارنس</h2>

<p>قريبًا سيتم إضافة المواسم والحلقات ومشغل الفيديو.</p>

</div>

</div>

<script>

setTimeout(function(){

document.getElementById("loader").style.display="none";

document.getElementById("main").style.display="block";

document.body.style.overflow="auto";

},2500);

</script>

</body>

</html>
